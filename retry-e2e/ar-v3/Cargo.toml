[package]
name = "retry-e2e-ar-v3"
version = "0.0.0"
edition = "2024"
publish = false

# Not part of the quinn workspace
[workspace]

[[bin]]
name = "retry_e2e"
path = "../src/main.rs"

[features]
default = ["filter", "split"]
filter = []
split = []

[dependencies]
# this series with alessandrod/recvmmsg-main merged (branch ar-fast-retry-v3)
quinn = { git = "https://github.com/stablebits/quinn", rev = "a104fd2b3779574e7dd538a3d4fb1ae7b62dfc7f", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
proto = { package = "quinn-proto", git = "https://github.com/stablebits/quinn", rev = "a104fd2b3779574e7dd538a3d4fb1ae7b62dfc7f", default-features = false, features = ["rustls-ring"] }
bytes = "1"
libc = "0.2"
rcgen = "0.14"
ring = "0.17"
rustls = { version = "0.23.5", default-features = false, features = ["std", "ring"] }
socket2 = ">=0.5, <0.7"
tokio = { version = "1.28.1", features = ["rt-multi-thread", "time", "macros"] }

[profile.release]
debug = 1

# MAC tokens are not on fast-retry-v3
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("mac"))'] }
