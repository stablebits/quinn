[package]
name = "retry-e2e-v3"
version = "0.0.0"
edition = "2024"
publish = false

# Not part of the quinn workspace
[workspace]

[[bin]]
name = "retry_e2e"
path = "../src/main.rs"

[features]
filter = []

[dependencies]
quinn = { path = "../../quinn", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
proto = { package = "quinn-proto", path = "../../quinn-proto", default-features = false, features = ["rustls-ring"] }
bytes = "1"
libc = "0.2"
rcgen = "0.14"
ring = "0.17"
rustls = { version = "0.23.5", default-features = false, features = ["std", "ring"] }
socket2 = ">=0.5, <0.7"
tokio = { version = "1.28.1", features = ["rt-multi-thread", "time", "macros"] }

[profile.release]
debug = 1
